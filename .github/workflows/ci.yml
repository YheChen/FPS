name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux SDL dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DFPS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux SDL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev

      - name: Configure (ASan + UBSan)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DFPS_ENABLE_SANITIZERS=ON -DFPS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The WebRTC transport is off by default, so without this job it would only
  # ever be built on a developer's machine. Ubuntu only for now: Windows
  # runners have no system OpenSSL, which is the open question in M19b.
  webrtc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev

      - name: Configure (WebRTC enabled)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DFPS_ENABLE_WEBRTC=ON -DFPS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      # The loopback test runs a real DataChannel connection in-process, so it
      # exercises ICE, DTLS and SCTP without a browser or a network.
      - name: Test
        run: ctest --test-dir build --output-on-failure

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: clang-format check
        run: |
          pip install clang-format==22.1.8
          find engine game tests -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

      # libc++ includes <algorithm> transitively, so a missing include builds
      # on macOS and fails on MSVC. Catch it here rather than three jobs in.
      - name: Standard header check
        run: python3 tools/check_includes.py
