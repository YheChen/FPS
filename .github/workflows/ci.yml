name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux SDL dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DFPS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux SDL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev

      - name: Configure (ASan + UBSan)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DFPS_ENABLE_SANITIZERS=ON -DFPS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The WebRTC transport is off by default, so without this job it would only
  # ever be built on a developer's machine. Ubuntu only for now: Windows
  # runners have no system OpenSSL, which is the open question in M19b.
  webrtc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev

      - name: Configure (WebRTC enabled)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DFPS_ENABLE_WEBRTC=ON -DFPS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      # The loopback test runs a real DataChannel connection in-process, so it
      # exercises ICE, DTLS and SCTP without a browser or a network.
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The Emscripten client, built AND run. Building it is the easy half and on
  # its own it proves very little: every web-only defect this project has
  # shipped compiled cleanly and broke in the browser -- a GLSL ES precision
  # error, a 0x0 startup canvas, a WebGL uniform-indexing cliff, and a `web`
  # preset with no toolchain file that quietly emitted a native binary. So the
  # job loads the page in headless Chrome and checks that frames actually go
  # by. See tools/web_smoke.mjs.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned like every other dependency: an emsdk bump should be a commit,
      # not a surprise on an unrelated PR.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.4
          actions-cache-folder: emsdk-cache

      # After setup-emsdk, so this node wins on PATH. The smoke harness drives
      # Chrome over a WebSocket and uses the global one, which is Node 22+;
      # emsdk bundles a suitable node itself, but relying on that would make
      # the harness hostage to an emsdk bump.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Warnings-as-errors matters more here than on the native jobs, not less:
      # size_t is 32 bits on wasm32, so 64-bit truncations that are lossless
      # everywhere else become real narrowing on this target. Turning this on
      # found three of them in the WebSocket frame parser.
      - name: Configure
        run: emcmake cmake --preset web -DFPS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset web --parallel

      # Chrome is preinstalled on the GitHub Ubuntu images; there is no GPU, so
      # WebGL comes from SwiftShader (the harness passes the flags for it).
      - name: Browser smoke test
        run: node tools/web_smoke.mjs

      # Same client, but booted against a 0-height canvas on purpose. A plain
      # headless load lays the canvas out before the module starts and so never
      # reproduces the startup race that broke the web client once already.
      - name: Browser smoke test (zero-height canvas at startup)
        run: node tools/web_smoke.mjs --zero-canvas

      - name: Upload the built client
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-client
          path: |
            build/web/game/fps_client.html
            build/web/game/fps_client.js
            build/web/game/fps_client.wasm
            build/web/game/fps_client.data
          if-no-files-found: warn

  # Proves the deploy instructions, which are the one build nobody runs by
  # accident: a headless box that installs a toolchain and nothing else, then
  # builds ONLY fps_server.
  #
  # The first run of this job failed, which is the reason it exists. SDL3's
  # CMake does not merely go unused on a headless host -- it hard-errors
  # ("could not find X11 or Wayland development libraries") during configure,
  # whether or not the target is ever built. So docs/deploy.md had been telling
  # people to run a command that could not work. FPS_BUILD_CLIENT=OFF now skips
  # SDL3/ImGui/glad/miniaudio entirely.
  #
  # In a container, not on ubuntu-latest: the runner image ships those headers,
  # so it would pass whether or not the claim holds. The install lines below are
  # exactly the ones in the docs -- if they change here, they change there.
  #
  # Both distros, because the guide gives both and the actual deployment target
  # is Fedora. An instruction nobody executes is a guess.
  deploy-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            image: fedora:latest
            install: dnf install -y git cmake ninja-build gcc-c++ make ca-certificates
          - distro: ubuntu
            image: ubuntu:24.04
            install: apt-get update && apt-get install -y git cmake ninja-build build-essential ca-certificates
    name: deploy-build (${{ matrix.distro }})
    container: ${{ matrix.image }}
    steps:
      - name: Install the toolchain (and nothing else)
        run: ${{ matrix.install }}

      - uses: actions/checkout@v4

      - name: Versions must satisfy CMake >= 3.25 and C++23
        run: cmake --version && g++ --version

      - name: Configure and build fps_server only
        run: |
          cmake --preset release -DFPS_BUILD_CLIENT=OFF -DFPS_BUILD_TESTS=OFF
          cmake --build --preset release --target fps_server --parallel

      # If SDL/ImGui/miniaudio ever creep back into a server build, this is
      # where it shows up -- a slow, fragile deploy that needs graphics
      # packages, rather than an outright failure.
      - name: No client dependencies were fetched
        run: |
          for dep in sdl3 imgui miniaudio; do
            if [ -d "build/release/_deps/${dep}-src" ]; then
              echo "FAIL: ${dep} was fetched for a server-only build"
              exit 1
            fi
          done
          echo "fetched: $(ls build/release/_deps | grep -- -src$ | tr '\n' ' ')"

      # A server that builds but cannot find assets/ or open a socket is not
      # deployable, and both failures are silent until someone tries to play.
      - name: It starts, loads the map, and serves
        run: ./build/release/game/fps_server --ws-port 7778 --no-enet --bots 2 --run-seconds 5

  # The container image and compose stack from deploy/. Built and RUN, because
  # an image that builds but whose health check never passes is worse than no
  # image -- compose would sit there restarting it.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the server image
        run: docker build -f deploy/Dockerfile -t fps-server:ci .

      # The image's own HEALTHCHECK speaks the real game protocol (WebSocket
      # upgrade + ClientHello/ServerWelcome), so waiting for "healthy" proves
      # the server loaded its assets and is serving, not merely that a process
      # is alive.
      - name: Wait for the container to report healthy
        run: |
          docker run -d --name fps-ci -p 7778:7778 fps-server:ci \
            --ws-port 7778 --no-enet --bots 2
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' fps-ci 2>/dev/null || echo missing)
            echo "  health: $status"
            case "$status" in
              healthy) exit 0 ;;
              unhealthy) docker logs fps-ci; exit 1 ;;
            esac
            sleep 5
          done
          echo "never became healthy"
          docker logs fps-ci
          exit 1

      # Proves the port mapping too: the health check runs inside the
      # container, so on its own it says nothing about reachability.
      - name: Reachable from outside the container
        run: python3 tools/ws_smoke.py 127.0.0.1 7778

      - name: Clean up
        if: always()
        run: docker rm -f fps-ci || true

      # Catches a compose file that references a missing service, a bad
      # interpolation, or a volume typo -- none of which the Dockerfile build
      # would surface.
      - name: Compose config is valid
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/compose.yaml --env-file deploy/.env config >/dev/null
          echo "compose config OK"

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: clang-format check
        run: |
          pip install clang-format==22.1.8
          find engine game tests -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

      # libc++ includes <algorithm> transitively, so a missing include builds
      # on macOS and fails on MSVC. Catch it here rather than three jobs in.
      - name: Standard header check
        run: python3 tools/check_includes.py
