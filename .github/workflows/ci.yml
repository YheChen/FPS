name: CI

on:
  push:
    branches: [main]
  pull_request:

# The client's server address is compiled in, not read at runtime, so it is a
# property of the build rather than of the deployment. Setting it here means
# the binary the browser smoke test exercises is the same binary that ships --
# baking it only at deploy time would ship something no test ever loaded.
#
# Repository variables override both, so a fork does not have to inherit this
# deployment's hostnames.
env:
  FPS_WEB_SERVER_URL: ${{ vars.FPS_WEB_SERVER_URL || 'wss://fps-server.yanzhenchen.ca' }}
  FPS_CLIENT_URL: ${{ vars.FPS_CLIENT_URL || 'https://fps.yanzhenchen.ca' }}

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux SDL dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DFPS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure --timeout 120

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux SDL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev

      # WEBRTC=ON matters here: without it the transport that does the most
      # threading in the whole project -- and the only code that hands buffers
      # to a third-party library's callback threads -- was the one part never
      # covered by ASan. A use-after-free on shutdown lived there for two
      # milestones, surfacing as a segfault in about one CI run in ten.
      - name: Configure (ASan + UBSan)
        run: |
          sudo apt-get install -y libssl-dev
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DFPS_ENABLE_SANITIZERS=ON \
                -DFPS_ENABLE_WEBRTC=ON -DFPS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      # --timeout because a deadlock is a real failure mode here, not a
      # hypothetical: this teardown path produced one in M19a, and produced
      # another under ASan's timing while this fix was being written. Without
      # it ctest waits forever and the job holds a runner for six hours before
      # anyone learns anything. The slowest test is ~2 s, so 120 s is headroom.
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

  # The WebRTC transport is off by default, so without this job it would only
  # ever be built on a developer's machine. Ubuntu only for now: Windows
  # runners have no system OpenSSL, which is the open question in M19b.
  webrtc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev

      - name: Configure (WebRTC enabled)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DFPS_ENABLE_WEBRTC=ON -DFPS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      # The loopback test runs a real DataChannel connection in-process, so it
      # exercises ICE, DTLS and SCTP without a browser or a network.
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

      # The shutdown race this guards against needed a callback to be in
      # flight at the moment of teardown, so a single pass proves little: it
      # reproduced in roughly one run in ten. Repeating the WebRTC tests turns
      # "probably fixed" into evidence, and costs a few seconds.
      # "DataChannel" uniquely names the loopback test -- the only one that
      # sets up and tears down a live connection, and so the only one that can
      # hit the race. Catch2 tags do not become ctest labels, hence matching
      # on the name.
      - name: Repeat the loopback test (shutdown races are rare per-run)
        run: ctest --test-dir build -R DataChannel --repeat until-fail:20 --output-on-failure --timeout 120

  # The Emscripten client, built AND run. Building it is the easy half and on
  # its own it proves very little: every web-only defect this project has
  # shipped compiled cleanly and broke in the browser -- a GLSL ES precision
  # error, a 0x0 startup canvas, a WebGL uniform-indexing cliff, and a `web`
  # preset with no toolchain file that quietly emitted a native binary. So the
  # job loads the page in headless Chrome and checks that frames actually go
  # by. See tools/web_smoke.mjs.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned like every other dependency: an emsdk bump should be a commit,
      # not a surprise on an unrelated PR.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.4
          actions-cache-folder: emsdk-cache

      # After setup-emsdk, so this node wins on PATH. The smoke harness drives
      # Chrome over a WebSocket and uses the global one, which is Node 22+;
      # emsdk bundles a suitable node itself, but relying on that would make
      # the harness hostage to an emsdk bump.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Warnings-as-errors matters more here than on the native jobs, not less:
      # size_t is 32 bits on wasm32, so 64-bit truncations that are lossless
      # everywhere else become real narrowing on this target. Turning this on
      # found three of them in the WebSocket frame parser.
      - name: Configure
        run: |
          emcmake cmake --preset web -DFPS_WARNINGS_AS_ERRORS=ON \
                        -DFPS_WEB_SERVER_URL="$FPS_WEB_SERVER_URL"

      - name: Build
        run: cmake --build --preset web --parallel

      # Chrome is preinstalled on the GitHub Ubuntu images; there is no GPU, so
      # WebGL comes from SwiftShader (the harness passes the flags for it).
      - name: Browser smoke test
        run: node tools/web_smoke.mjs

      # Same client, but booted against a 0-height canvas on purpose. A plain
      # headless load lays the canvas out before the module starts and so never
      # reproduces the startup race that broke the web client once already.
      - name: Browser smoke test (zero-height canvas at startup)
        run: node tools/web_smoke.mjs --zero-canvas

      # Assembled into one flat directory rather than uploaded as scattered
      # paths, because this IS the deployable site: what `deploy-web` uploads
      # to Vercel is this directory verbatim. Staging it here means the layout
      # is decided by the job that knows how the build lays out, and the same
      # tree is what a human downloads when a smoke test fails.
      #
      # `favicon.ico` is copied next to the client by CMake (it cannot ride in
      # the --preload-file bundle; the tab chrome fetches it over HTTP), and
      # `vercel.json` carries the `/` rewrite and the cache headers.
      - name: Stage the deployable site
        if: always()
        run: |
          if [ ! -f build/web/game/fps_client.wasm ]; then
            echo "::notice::no client build to stage"
            exit 0
          fi
          mkdir -p dist
          cp build/web/game/fps_client.html \
             build/web/game/fps_client.js \
             build/web/game/fps_client.wasm \
             build/web/game/fps_client.data \
             build/web/game/favicon.ico \
             dist/
          cp web/vercel.json dist/
          # What this client speaks, published alongside it. The server's
          # autodeploy on the T14 reads this and REFUSES to ship a server
          # whose protocol has moved past it -- otherwise a green build
          # deploys a server no existing client can join. The client is the
          # only half that can honestly declare this, because it is the half
          # that gets published to a URL.
          protocol=$(grep -oE 'kProtocolVersion = [0-9]+' game/shared/protocol.h \
                     | grep -oE '[0-9]+')
          [ -n "$protocol" ] || { echo "::error::could not read kProtocolVersion"; exit 1; }
          printf '{"protocol": %s, "commit": "%s"}\n' "$protocol" "$GITHUB_SHA" > dist/version.json
          cat dist/version.json
          ls -l dist

      - name: Upload the built client
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-client
          path: dist
          if-no-files-found: warn

  # Publishes the client the `web` job just proved renders in a real browser.
  #
  # It deploys that job's ARTIFACT rather than rebuilding: a second compile is
  # a second binary, and shipping one no smoke test ever loaded is precisely
  # the gap this milestone closes. The `needs:` is therefore a quality gate,
  # not just ordering -- a client that fails to render cannot reach players.
  #
  # Only on a push to main. Pull requests must not deploy, and must not be
  # handed the token: a PR from a fork would otherwise get publish rights to
  # the live site.
  deploy-web:
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # To move the `client-live` tag below.
    permissions:
      contents: write
    # Two pushes in quick succession would otherwise race, and the loser --
    # not the newer commit -- could be the one left live. Never cancel a
    # deploy midway; a half-uploaded site is worse than a queued one.
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    steps:
      # The `secrets` context is not available in a job-level `if`, so the
      # gate has to be a step. An unconfigured repository (a fork, or this one
      # before the secrets are added) should skip the deploy and say so --
      # not fail a build whose code is fine.
      - name: Is Vercel configured?
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel secrets not set; skipping the deploy (docs/deploy.md section 5)."
          fi

      # This job deploys a downloaded ARTIFACT, so it never needed the source
      # and never checked it out. Then M32c added a `git tag` at the end of
      # it, which cannot work in a directory that is not a repository -- the
      # deploy succeeded and the job failed, every time, on that last step.
      #
      # Must come BEFORE the artifact download: checkout cleans its working
      # directory, and would delete a `dist` fetched ahead of it.
      - name: Check out the repository
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Download the smoke-tested client
        if: steps.gate.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: web-client
          path: dist

      # The other half of the autodeploy protocol guard, pointing the other
      # way. That one refuses to ship a SERVER the published client cannot
      # talk to; nothing refused to ship a CLIENT the live server cannot talk
      # to -- and on 2026-08-09 that is exactly what happened: the client went
      # out at protocol 6 against a protocol 4 server, and every connection
      # was rejected until someone noticed and ran `--force` on the host.
      #
      # It asks the live server directly, with the same tool the container's
      # own healthcheck uses, over the real TLS proxy. No credential, no new
      # endpoint, and no record of what someone believes is deployed -- the
      # answer comes from the process that would be doing the rejecting.
      #
      # ENFORCED ONLY WHEN THE PROTOCOL ACTUALLY MOVED, which is a handful of
      # commits out of hundreds. Blocking every routine client deploy on
      # whether a laptop at the end of a home connection is reachable from a
      # GitHub runner would fail far more often, and for reasons that have
      # nothing to do with whether the client is safe to publish.
      - name: Can the live server talk to this client?
        id: protocol
        if: steps.gate.outputs.ready == 'true'
        run: |
          built=$(grep -oE 'kProtocolVersion = [0-9]+' game/shared/protocol.h | grep -oE '[0-9]+')
          [ -n "$built" ] || { echo "::error::could not read kProtocolVersion"; exit 1; }

          # What the currently-published client speaks. `client-live` is not
          # fetched by a default checkout, and its absence is meaningful -- no
          # client has ever been published -- so failing to get it is not an
          # error here.
          git fetch --depth=1 origin +refs/tags/client-live:refs/tags/client-live 2>/dev/null || true
          published=$(git show client-live:game/shared/protocol.h 2>/dev/null \
                      | grep -oE 'kProtocolVersion = [0-9]+' | grep -oE '[0-9]+' || true)
          echo "built protocol: $built | published: ${published:-<none>}"

          # wss://host[:port] -> host, port, and whether to wrap in TLS.
          url="$FPS_WEB_SERVER_URL"
          scheme=${url%%://*}
          hostport=${url#*://}; hostport=${hostport%%/*}
          host=${hostport%%:*}; port=${hostport##*:}
          if [ "$port" = "$host" ]; then
            if [ "$scheme" = "wss" ]; then port=443; else port=80; fi
          fi
          if [ "$scheme" = "wss" ]; then tls=--tls; else tls=--no-tls; fi

          # `|| probe=$?` rather than checking $? afterwards: this step runs
          # under bash -e, where a non-zero exit IS the answer we want and
          # would otherwise kill the step before we could read it.
          echo "probing $scheme://$host:$port with protocol $built"
          probe=0
          python3 tools/ws_smoke.py "$host" "$port" "$tls" --protocol "$built" || probe=$?

          if [ "$probe" -eq 0 ]; then
            echo "the live server speaks protocol $built"
            exit 0
          fi

          # 3 means the server answered and speaks something else; anything
          # else means no answer at all. Only the first is evidence.
          if [ "$probe" -eq 3 ]; then
            detail="the live server is up and does NOT speak protocol $built"
          else
            detail="the live server could not be reached (ws_smoke exit $probe)"
          fi

          if [ "$built" = "${published:-$built}" ]; then
            echo "::warning::$detail, but this client's protocol ($built) is unchanged since the published one, so publishing it cannot make anything worse."
            exit 0
          fi

          {
            echo "### Client deploy held"
            echo
            echo "This client speaks protocol \`$built\`, the published one speaks \`${published:-none}\`, and $detail."
            echo
            echo "A protocol bump is a deliberate two-step, **server first**:"
            echo
            echo '1. On the server host: `tools/server_autodeploy.sh --force`'
            echo '2. Re-run this job. The probe passes and the client publishes.'
            echo
            echo "Both guards refuse until one is told to go first. That is the hold working:"
            echo "the game stays up on the old protocol, on both sides, until you break the tie."
            echo "Between step 1 and step 2 players get \`ServerReject(VersionMismatch)\`; the"
            echo "client waits that out and offers a reload rather than erroring."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::$detail; deploy the server first (see the job summary)"
          exit 1

      # Pinned like every other dependency. `--yes` skips the interactive
      # project prompt; ORG/PROJECT ids in the environment are what tell the
      # CLI which project this is, with no `vercel link` and no committed
      # `.vercel/` directory.
      - name: Deploy to Vercel
        if: steps.gate.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@58.9.0
          vercel deploy dist --prod --yes --token "$VERCEL_TOKEN"

      # A deploy that reports success and serves the previous build is the
      # exact failure this project has already hit once: `vercel.json` used to
      # mark these filenames `immutable`, so returning players kept a client
      # compiled against a hostname that no longer existed. "The command
      # exited 0" is not evidence the site changed -- fetching it is.
      #
      # Retried because a CDN propagates; failed outright after five minutes,
      # because by then it is not propagation.
      - name: Verify the live site serves this exact build
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -uo pipefail
          expected=$(sha256sum dist/fps_client.wasm | cut -d' ' -f1)
          echo "built wasm sha256: $expected"
          for attempt in $(seq 1 20); do
            actual=$(curl -fsSL --max-time 60 "$FPS_CLIENT_URL/fps_client.wasm" \
                     | sha256sum | cut -d' ' -f1 || true)
            if [ "$actual" = "$expected" ]; then
              echo "live site matches the build after attempt ${attempt}"
              # The `/` rewrite is configuration too, and it can break on its
              # own while the asset is perfectly correct.
              curl -fsS --max-time 30 "$FPS_CLIENT_URL/" | grep -qi 'canvas' \
                || { echo "::error::$FPS_CLIENT_URL/ did not serve the client page"; exit 1; }
              # These filenames never change between builds, so `immutable`
              # means a returning player is pinned to whatever they cached --
              # for a year. That has already happened here once, and it had to
              # be found by hand in a private browsing window. `vercel.json`
              # fixes it; this makes sure the fix is what actually shipped,
              # since uploading a correct config and serving an old one is the
              # failure mode, not writing the wrong config.
              if curl -fsSI --max-time 30 "$FPS_CLIENT_URL/fps_client.wasm" \
                 | grep -qi 'cache-control:.*immutable'; then
                echo "::error::$FPS_CLIENT_URL serves fps_client.wasm as immutable; vercel.json did not take effect"
                exit 1
              fi
              echo "### Deployed [$FPS_CLIENT_URL]($FPS_CLIENT_URL)" >> "$GITHUB_STEP_SUMMARY"
              echo "\`fps_client.wasm\` sha256 \`$expected\` verified live." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt ${attempt}: live site served '${actual:-<fetch failed>}'"
            sleep 15
          done
          echo "::error::$FPS_CLIENT_URL never served the wasm just deployed"
          exit 1

      # Records WHICH COMMIT's client is live, as a git tag.
      #
      # version.json says the same thing over HTTP, and the autodeploy guard
      # used to read it there. It refused four runs in a row saying the file
      # "could not be read".
      #
      # The original diagnosis here was that Vercel's bot mitigation answers
      # `curl` with a 403 challenge page. That does NOT reproduce: curl from
      # the T14 and from a laptop both get HTTP 200. What is true is that the
      # refusals all landed within ~30 s of a deploy finishing, so the likelier
      # cause was reading it before it was live. Treat the WAF story as
      # unproven.
      #
      # A tag has none of that. The consumer is a host that already does a
      # `git fetch` against this repo, needs no new credential, and gets an
      # answer no interstitial can intercept. version.json stays -- it is
      # genuinely useful from a browser console -- but it is no longer what
      # anything depends on.
      - name: Mark this commit as the live client
        if: steps.gate.outputs.ready == 'true'
        run: |
          git tag -f client-live "$GITHUB_SHA"
          git push -f origin refs/tags/client-live

  # Proves the deploy instructions, which are the one build nobody runs by
  # accident: a headless box that installs a toolchain and nothing else, then
  # builds ONLY fps_server.
  #
  # The first run of this job failed, which is the reason it exists. SDL3's
  # CMake does not merely go unused on a headless host -- it hard-errors
  # ("could not find X11 or Wayland development libraries") during configure,
  # whether or not the target is ever built. So docs/deploy.md had been telling
  # people to run a command that could not work. FPS_BUILD_CLIENT=OFF now skips
  # SDL3/ImGui/glad/miniaudio entirely.
  #
  # In a container, not on ubuntu-latest: the runner image ships those headers,
  # so it would pass whether or not the claim holds. The install lines below are
  # exactly the ones in the docs -- if they change here, they change there.
  #
  # Both distros, because the guide gives both and the actual deployment target
  # is Fedora. An instruction nobody executes is a guess.
  deploy-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            image: fedora:latest
            install: dnf install -y git cmake ninja-build gcc-c++ make ca-certificates
          - distro: ubuntu
            image: ubuntu:24.04
            install: apt-get update && apt-get install -y git cmake ninja-build build-essential ca-certificates
    name: deploy-build (${{ matrix.distro }})
    container: ${{ matrix.image }}
    steps:
      - name: Install the toolchain (and nothing else)
        run: ${{ matrix.install }}

      - uses: actions/checkout@v4

      - name: Versions must satisfy CMake >= 3.25 and C++23
        run: cmake --version && g++ --version

      - name: Configure and build fps_server only
        run: |
          cmake --preset release -DFPS_BUILD_CLIENT=OFF -DFPS_BUILD_TESTS=OFF
          cmake --build --preset release --target fps_server --parallel

      # If SDL/ImGui/miniaudio ever creep back into a server build, this is
      # where it shows up -- a slow, fragile deploy that needs graphics
      # packages, rather than an outright failure.
      - name: No client dependencies were fetched
        run: |
          for dep in sdl3 imgui miniaudio; do
            if [ -d "build/release/_deps/${dep}-src" ]; then
              echo "FAIL: ${dep} was fetched for a server-only build"
              exit 1
            fi
          done
          echo "fetched: $(ls build/release/_deps | grep -- -src$ | tr '\n' ' ')"

      # A server that builds but cannot find assets/ or open a socket is not
      # deployable, and both failures are silent until someone tries to play.
      - name: It starts, loads the map, and serves
        run: ./build/release/game/fps_server --ws-port 7778 --no-enet --bots 2 --run-seconds 5

  # The container image and compose stack from deploy/. Built and RUN, because
  # an image that builds but whose health check never passes is worse than no
  # image -- compose would sit there restarting it.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First, because it takes a second and the image build takes minutes.
      #
      # server_autodeploy.sh is the only thing here that has taken the live
      # game down -- twice on 2026-08-09 -- and both times the bug was in its
      # decision table, which no build could have caught. The test stubs
      # `docker` and uses a temp repository as "GitHub", so it needs neither.
      - name: The autodeploy decision table
        run: |
          shellcheck tools/*.sh tests/deploy/*.sh
          tests/deploy/autodeploy_test.sh

      - name: Build the server image
        run: docker build -f deploy/Dockerfile -t fps-server:ci .

      # The image's own HEALTHCHECK speaks the real game protocol (WebSocket
      # upgrade + ClientHello/ServerWelcome), so waiting for "healthy" proves
      # the server loaded its assets and is serving, not merely that a process
      # is alive.
      - name: Wait for the container to report healthy
        run: |
          docker run -d --name fps-ci -p 7778:7778 fps-server:ci \
            --ws-port 7778 --no-enet --bots 2
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' fps-ci 2>/dev/null || echo missing)
            echo "  health: $status"
            case "$status" in
              healthy) exit 0 ;;
              unhealthy) docker logs fps-ci; exit 1 ;;
            esac
            sleep 5
          done
          echo "never became healthy"
          docker logs fps-ci
          exit 1

      # Proves the port mapping too: the health check runs inside the
      # container, so on its own it says nothing about reachability.
      - name: Reachable from outside the container
        run: python3 tools/ws_smoke.py 127.0.0.1 7778

      - name: Clean up
        if: always()
        run: docker rm -f fps-ci || true

      # Catches a compose file that references a missing service, a bad
      # interpolation, or a volume typo -- none of which the Dockerfile build
      # would surface.
      - name: Compose config is valid
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/compose.yaml --env-file deploy/.env config >/dev/null
          echo "compose config OK"

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: clang-format check
        run: |
          pip install clang-format==22.1.8
          find engine game tests -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

      # libc++ includes <algorithm> transitively, so a missing include builds
      # on macOS and fails on MSVC. Catch it here rather than three jobs in.
      - name: Standard header check
        run: python3 tools/check_includes.py
