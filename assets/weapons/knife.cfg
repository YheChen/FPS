# Slot 5: the last resort, and the fastest thing to bring up.
#
# `melee=true` means no magazine and no reload, and `range` is arm's reach
# rather than a ballistic limit -- 2.2 m, a little beyond the 2 m the server
# uses for its wall-clearance probe, so a lunge connects at contact distance
# without reaching through cover.
#
# The trade is entirely range: 55 damage is two hits to kill against 100
# health, versus the rifle's four, and 150 rpm is a swing every 0.4 s. It
# wins a corner ambush and loses everything else.
name=knife
melee=true
damage=55
rounds_per_minute=150
magazine_size=0
reload_seconds=0
range=2.2
spread_degrees=0
pellets=1
automatic=true
# Fastest weapon to raise in the arsenal, which is the point of carrying it.
switch_seconds=0.15
# No fire_sound: a knife swing has no report, and the four gun sounds would
# all be wrong. It falls back to the generic fire.wav, which is what it has
# always played. A proper swing/impact pair is worth doing on its own.
