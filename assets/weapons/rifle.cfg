# Standard-issue hitscan rifle: the all-rounder.
name=rifle
damage=25
rounds_per_minute=600
magazine_size=30
reload_seconds=1.8
range=100
spread_degrees=1.0
pellets=1
automatic=true
# Mid-forward crack with a bolt tick 28 ms behind it: the only weapon in
# the set whose shot has two discrete events, and dead by 90 ms so the
# 100 ms shot grid stays audible under sustained fire.
fire_sound=fire_rifle.wav
switch_seconds=0.4
# The all-rounder's falloff is the baseline every other weapon is read
# against: full damage across a normal engagement, tapering past it so it
# does not also win the long-range fight the sniper is carried for.
falloff_start_meters=35
falloff_end_meters=80
falloff_min_fraction=0.6
# Sights are this weapon's identity: a modest zoom and a cone cut to about a
# third, which turns it from a mid-range spray into the thing you pick when
# you expect to be aiming first.
ads_fov_scale=0.75
ads_spread_scale=0.35
ads_seconds=0.20
