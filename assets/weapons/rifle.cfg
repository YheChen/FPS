# Standard-issue hitscan rifle: the all-rounder.
name=rifle
damage=25
rounds_per_minute=600
magazine_size=30
reload_seconds=1.8
range=100
spread_degrees=1.0
pellets=1
automatic=true
switch_seconds=0.4
# The all-rounder's falloff is the baseline every other weapon is read
# against: full damage across a normal engagement, tapering past it so it
# does not also win the long-range fight the sniper is carried for.
falloff_start_meters=35
falloff_end_meters=80
falloff_min_fraction=0.6
