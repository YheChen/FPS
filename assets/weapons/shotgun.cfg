# Close-range burst damage: 8 pellets in a wide cone, slow and punishing to miss.
name=shotgun
damage=11
rounds_per_minute=75
magazine_size=6
reload_seconds=2.6
range=40
spread_degrees=5.0
pellets=8
automatic=false
# Darkest and lowest of the four, with no supersonic crack -- pellets do
# not go supersonic -- and the pump rack baked in at 162/218 ms, which is
# both the unmistakable blind tell and a clock on the next shot.
fire_sound=fire_shotgun.wav
switch_seconds=0.5
# Deliberately below the 2.0 default: a pellet finding a head inside a
# 5-degree cone is luck, not aim, and 8 of them at x2 would delete anyone who
# turned a corner. Rewarded, but not as the rifle rewards a placed shot.
head_multiplier=1.5
limb_multiplier=0.8
# The steepest curve in the arsenal, and the one doing the most design work:
# 8 pellets x 11 is 88 up close, but a quarter of that past 25 m. Each pellet
# is attenuated at its own distance.
falloff_start_meters=8
falloff_end_meters=25
falloff_min_fraction=0.25
# A choke, not a scope. The pellet cone narrows to 70% -- enough to reward
# aiming at the edge of its range without letting it snipe.
ads_fov_scale=0.90
ads_spread_scale=0.70
ads_seconds=0.25
