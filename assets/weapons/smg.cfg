# High rate of fire, low per-shot damage, noticeable spread. Fast to swap to.
name=smg
damage=14
rounds_per_minute=900
magazine_size=35
reload_seconds=1.5
range=60
spread_degrees=2.2
pellets=1
automatic=true
switch_seconds=0.3
# Starts falling off well before the rifle does, and lands harder. Inside a
# room it out-trades everything; across the arena it should not.
falloff_start_meters=15
falloff_end_meters=40
falloff_min_fraction=0.45
