# High rate of fire, low per-shot damage, noticeable spread. Fast to swap to.
name=smg
damage=14
rounds_per_minute=900
magazine_size=35
reload_seconds=1.5
range=60
spread_degrees=2.2
pellets=1
automatic=true
# 49 ms against a 66.7 ms shot interval, so rounds never overlap: thin,
# bright and countable rather than a wall of noise.
fire_sound=fire_smg.wav
switch_seconds=0.3
# Starts falling off well before the rifle does, and lands harder. Inside a
# room it out-trades everything; across the arena it should not.
falloff_start_meters=15
falloff_end_meters=40
falloff_min_fraction=0.45
# Least zoom, fastest sights, and only half the cone back. The SMG is the
# run-and-gun weapon, so aiming should feel available mid-fight rather than
# like a commitment -- and it must not become a rifle when you use it.
ads_fov_scale=0.85
ads_spread_scale=0.50
ads_seconds=0.15
