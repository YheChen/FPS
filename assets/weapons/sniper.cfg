# Two-shot kill at any range, pinpoint accurate, heavily punished on a miss.
name=sniper
damage=75
rounds_per_minute=45
magazine_size=5
reload_seconds=3.0
range=200
spread_degrees=0
pellets=1
automatic=false
# Bright 1-5 kHz crack plus a 240 ms tail whose cutoff glides shut, so it
# reads as a large rifle fired in the open. Bright on purpose: at 200 m
# the client's distance ramp has bottomed out and timbre is all that is
# left to carry the weapon's identity.
fire_sound=fire_sniper.wav
switch_seconds=0.7
# 75 x 2.0 is 150 against 100 health: a clean head shot is a one-shot kill.
# That is the whole point of carrying a weapon this slow.
head_multiplier=2.0
limb_multiplier=0.6
