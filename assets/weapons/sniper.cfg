# Two-shot kill at any range, pinpoint accurate, heavily punished on a miss.
name=sniper
damage=75
rounds_per_minute=45
magazine_size=5
reload_seconds=3.0
range=200
spread_degrees=0
pellets=1
automatic=false
# Bright 1-5 kHz crack plus a 240 ms tail whose cutoff glides shut, so it
# reads as a large rifle fired in the open. Bright on purpose: at 200 m
# the client's distance ramp has bottomed out and timbre is all that is
# left to carry the weapon's identity.
fire_sound=fire_sniper.wav
switch_seconds=0.7
# 75 x 2.0 is 150 against 100 health: a clean head shot is a one-shot kill.
# That is the whole point of carrying a weapon this slow.
head_multiplier=2.0
limb_multiplier=0.6
# Barely falls off at all, and only past the range the other three have
# already given up at. This is what it trades its fire rate for.
falloff_start_meters=100
falloff_end_meters=200
falloff_min_fraction=0.85
# The scope. The strongest zoom in the arsenal and the slowest to raise:
# 0.35 turns a 70 degree FOV into 24, which is what makes the 200 m range
# usable, and 0.35 s means you cannot flick-scope out of a losing fight.
# ads_spread_scale is left at 1.0 because this weapon's cone is already 0 --
# there is nothing to tighten, so the scope buys sight, not accuracy.
ads_fov_scale=0.35
ads_seconds=0.35
