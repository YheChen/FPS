# Dedicated server + TLS reverse proxy. See docs/deploy.md.
#
#     cp deploy/.env.example deploy/.env    # then edit it
#     docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --build
#
# Survives reboot via `restart: unless-stopped` plus an enabled docker service:
#     sudo systemctl enable --now docker

services:
  server:
    build:
      # The build context is the repository root; this file lives in deploy/.
      context: ..
      dockerfile: deploy/Dockerfile
    image: fps-server:local
    container_name: fps-server
    restart: unless-stopped
    command:
      - "--ws-port"
      - "7778"
      - "--no-enet"
      - "--bots"
      - "${FPS_BOTS:-0}"
      - "--bot-skill"
      - "${FPS_BOT_SKILL:-normal}"
      # One map, or several comma-separated to rotate between matches (M51).
      # `--maps` with a single entry is exactly `--map`, so this covers both
      # and there is only one variable to reason about.
      #
      # Every arena ships inside the client, so rotating between them needs no
      # client redeploy, and since M51b a client that arrives while the server
      # is on the other map loads it instead of being turned away. Adding a
      # NEW map is still a client change: publish a client that contains it
      # before rotating to it, or arrivals get refused.
      - "--maps"
      - "${FPS_MAPS:-maps/arena01.glb}"
      # Career stats. The path is inside the one writable mount below; a
      # server told to write anywhere else on this root filesystem would
      # fail, loudly, at the first save rather than at startup.
      - "--stats"
      - "/var/lib/fps/stats.bin"
    # Not published to the host: only Caddy needs to reach it, over the
    # compose network. Publishing 7778 would put the plain ws:// server on the
    # LAN alongside the TLS one, which is the opposite of the point.
    expose:
      - "7778"
    networks: [fps]
    # The root filesystem stays read-only: career stats are the ONLY state
    # this process keeps, so they get one named volume rather than a writable
    # root. StatsStore writes a temp file and renames it, so both live in this
    # directory -- a rename across a mount boundary is a copy, not an atomic
    # replace, which would reintroduce the torn write it exists to prevent.
    read_only: true
    volumes:
      # No `:z` here. That flag relabels a BIND mount for SELinux; on a named
      # volume it is meaningless, and Docker warns "mount of type volume
      # should not define bind option". The other mounts in this file are
      # binds and do need it.
      - fps-stats:/var/lib/fps
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    container_name: fps-caddy
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "443:443"
      # Port 80 is only needed for the ACME HTTP-01 challenge. Comment it out
      # on the DNS-01 path; leaving it published on a residential connection
      # is a listener you are not using.
      - "80:80"
    environment:
      # Consumed by the Caddyfile. The Porkbun pair is only read on the
      # DNS-01 path and is otherwise unset.
      FPS_DOMAIN: "${FPS_DOMAIN:?set FPS_DOMAIN in deploy/.env}"
      PORKBUN_API_KEY: "${PORKBUN_API_KEY:-}"
      PORKBUN_API_SECRET_KEY: "${PORKBUN_API_SECRET_KEY:-}"
    volumes:
      # :z relabels for SELinux, which is enforcing on Fedora. Without it the
      # container gets permission denied on a bind mount and the cause is not
      # obvious from the error.
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
      - caddy_config:/config
    networks: [fps]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  fps:
    driver: bridge

volumes:
  # Named, so the certificate survives `down` and you do not re-hit Let's
  # Encrypt rate limits on every restart.
  caddy_data:
  caddy_config:
  # Career stats. Named for the same reason: `docker compose down` is a normal
  # thing to do, and it must not take everyone's record with it.
  fps-stats:
